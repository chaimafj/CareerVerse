version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: careerverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'

  backend:
    build:
      context: ../backend/django-api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend/django-api:/app
    ports:
      - '8000:8000'
    depends_on:
      - db
